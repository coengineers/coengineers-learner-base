project_id = "coengineers-learner-base"
[api]
enabled = true
port = 58321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 58322
shadow_port = 58320
major_version = 17
[db.migrations]
enabled = true
[db.seed]
enabled = true
sql_paths = ["./seed.sql"]
[realtime]
enabled = false
[studio]
enabled = false
[inbucket]
enabled = true
port = 58324
[storage]
enabled = true
file_size_limit = "2MiB"
[auth]
enabled = true
site_url = "http://127.0.0.1:4310"
additional_redirect_urls = ["http://127.0.0.1:4310/account"]
jwt_expiry = 3600
enable_signup = true
minimum_password_length = 12
[auth.email]
enable_signup = true
enable_confirmations = false
double_confirm_changes = true
secure_password_change = true
max_frequency = "1s"
[edge_runtime]
enabled = false
[analytics]
enabled = false
