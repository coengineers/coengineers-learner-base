<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="580" viewBox="0 0 1080 580" role="img" aria-labelledby="title desc"><title id="title">Where a new capability belongs</title><desc id="desc">Arrows show allowed code dependencies. The composition root connects use cases to their adapters.</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#69758d"/></marker></defs><rect width="100%" height="100%" fill="#fff"/><g font-family="Arial, sans-serif" fill="#303749"><text x="540" y="50" text-anchor="middle" font-size="30" font-weight="bold">Where a new capability belongs</text><rect x="50" y="130" width="270" height="110" rx="15" fill="#eef0ff" stroke="#8993a9"/><text x="185" y="174" text-anchor="middle" font-size="19" >1. Translate a request</text><text x="185" y="206" text-anchor="middle" font-size="12" >Transport: HTTP, tRPC and MCP</text><rect x="400" y="130" width="270" height="110" rx="15" fill="#e8f4ed" stroke="#8993a9"/><text x="535" y="174" text-anchor="middle" font-size="19" >2. Do the useful work</text><text x="535" y="206" text-anchor="middle" font-size="12" >Application: use cases and ports</text><rect x="750" y="130" width="270" height="110" rx="15" fill="#fff0dd" stroke="#8993a9"/><text x="885" y="174" text-anchor="middle" font-size="19" >3. Apply business rules</text><text x="885" y="206" text-anchor="middle" font-size="12" >Domain: pure, testable decisions</text><rect x="400" y="360" width="270" height="110" rx="15" fill="#f1edff" stroke="#8993a9"/><text x="535" y="404" text-anchor="middle" font-size="19" >Replaceable connections</text><text x="535" y="436" text-anchor="middle" font-size="12" >Infrastructure implements ports</text><path d="M320 185 l80 0" fill="none" stroke="#69758d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M670 185 l80 0" fill="none" stroke="#69758d" stroke-width="1.5" marker-end="url(#arrow)"/><path d="M535 360 l0 -120" fill="none" stroke="#69758d" stroke-width="1.5" marker-end="url(#arrow)"/><text x="540" y="539" text-anchor="middle" font-size="14" >Arrows show allowed code dependencies. The composition root connects use cases to their adapters.</text></g></svg>
